name: Build WDialer APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Extract App Version from app/build.gradle
        id: versioning
        run: |
          APP_VER=$(grep 'versionName' app/build.gradle | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          BUILD_NUM=$(grep 'versionCode' app/build.gradle | head -n1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          if [ -z "$APP_VER" ]; then APP_VER="1.0.0"; fi
          echo "app_version=v$APP_VER" >> $GITHUB_OUTPUT
          echo "apk_file=WDialer-v$APP_VER.apk" >> $GITHUB_OUTPUT
          echo "Extracted App Version: v$APP_VER (build $BUILD_NUM)"

      - name: Prepare Direct APK Asset
        run: |
          mkdir -p build-output
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found in release folder, checking entire outputs..."
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "build-output/${{ steps.versioning.outputs.apk_file }}"

      - name: Upload Release APK Artifact (Zip Backup)
        uses: actions/upload-artifact@v4
        with:
          name: WDialer-Release-APK
          path: "build-output/${{ steps.versioning.outputs.apk_file }}"

      - name: Publish Direct Release APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "build-output/${{ steps.versioning.outputs.apk_file }}"
          name: "WDialer ${{ steps.versioning.outputs.app_version }}"
          tag_name: "${{ steps.versioning.outputs.app_version }}"
          make_latest: true
          overwrite: true
          body: |
            ## WDialer Release - Android APK 📞

            - **Jetpack Compose with Material 3 Expressive UI**
            - **Predictive T9 Search & Dual-SIM Intelligence**
            - **Privacy-First & Google Play Protect Compliant**
            - **Integrated SMS Messaging with Floating Quick Reply**
            - **Unannounced Call Recording support via Shizuku**
            - **Custom Edge-to-Edge Caller UI & Liquid Glass Shader Effects**

            👉 **Direct Download**: Download `${{ steps.versioning.outputs.apk_file }}` below to install directly on your Android device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
